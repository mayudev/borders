services:
  borders:
    image: melsincostan/borders
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      - TZ=Europe/Paris
      - SERVE_PORT=8080
      - DB_FILE=./borders.db
      - JWT_KEY_FILE=./key.bin
      - JWT_KEY_LENGTH=16